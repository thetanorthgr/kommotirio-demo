px;border-radius:2px;font-weight:600;font-size:15.5px;text-decoration:none;background:var(--ink);color:var(--paper);transition:.2s}\n.wp-block-button.gold .wp-block-button__link{background:var(--bronze-l);color:var(--ink)}\n.wp-block-button.gold .wp-block-button__link:hover{background:#D8BB82}\n.wp-block-button.line .wp-block-button__link{background:transparent;border:1px solid rgba(246,243,238,.45);color:var(--paper)}\n.wp-block-buttons{gap:14px}\n\n/* κεφαλίδα */\n.site-header{background:var(--ink);color:var(--paper)}\n.site-header .nav{min-height:84px;align-items:center}\n.brand{text-decoration:none;line-height:1.15;display:block}\n.brand b{font-family:var(--serif);font-weight:500;font-size:21px;display:block;letter-spacing:.01em}\n.brand span{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.75}\n.site-header .wp-block-navigation{font-size:14.5px;gap:30px}\n.site-header .wp-block-navigation a{text-decoration:none;opacity:.85}\n.site-header .wp-block-navigation a:hover{opacity:1}\n.site-header .wp-block-navigation__responsive-container.is-menu-open{background:var(--ink)!important;color:var(--paper)!important;padding:28px}\n.site-header .wp-block-navigation__responsive-container.is-menu-open .wp-block-navigation__container{gap:22px;font-size:20px}\n\n/* πρώτη οθόνη */\n.hero{background:var(--ink);color:var(--paper);overflow:hidden}\n.hero .wp-block-columns{align-items:flex-end!important;gap:56px;padding-top:86px;margin:0 auto!important}\n.hero h1{font-size:clamp(40px,5.6vw,68px);margin:18px 0 22px}\n.hero h1 em{font-style:normal;color:var(--bronze-l)}\n.hero .hero-text{font-size:19px;color:rgba(246,243,238,.78);max-width:560px}\n.hero .wp-block-buttons{margin-top:34px}\n.hero .meta{display:flex;flex-wrap:wrap;gap:18px 34px;margin-top:56px;padding:26px 0 34px;border-top:1px solid rgba(246,243,238,.16);font-size:14px;color:rgba(246,243,238,.7)}\n.hero .meta strong{display:block;color:var(--paper);font-weight:500;font-size:15px}\n.photo{position:relative;background:linear-gradient(160deg,#3A4766,#26314D 60%,#1B243B);aspect-ratio:4/5;border:1px solid rgba(201,168,106,.25)}\n.photo::after{content:\"\";position:absolute;inset:14px;border:1px solid rgba(201,168,106,.22)}\n.photo .ph{position:absolute;left:24px;right:24px;bottom:22px;font-size:12.5px;color:rgba(246,243,238,.6);letter-spacing:.04em}\n.photo .ph b{display:block;font-family:var(--serif);font-weight:500;font-size:17px;color:rgba(246,243,238,.85);margin-bottom:4px}\n\n/* ενότητες */\n.sec{padding:104px 0}\n.groups{gap:1px!important;background:var(--line);border:1px solid var(--line);margin:46px auto 0!important;padding:0!important;max-width:1112px}\n.groups>.wp-block-column{background:var(--paper);padding:30px 26px 32px;display:flex;flex-direction:column;min-height:330px}\n.groups>.wp-block-column:hover{background:var(--white)}\n.groups .n{font-family:var(--serif);color:var(--bronze);font-size:15px}\n.groups h3{font-size:24px;margin:14px 0}\n.groups ul{list-style:none;padding:0;margin:0;font-size:15px;color:var(--muted)}\n.groups li{padding:5px 0;border-bottom:1px solid var(--paper-2)}\n.groups .more{margin-top:auto;padding-top:20px;font-size:14px;font-weight:600}\n.groups .more a{text-decoration:none}\n.how{background:var(--paper-2)}\n.steps{gap:34px!important;margin-top:44px!important}\n.steps>.wp-block-column{border-top:2px solid var(--bronze);padding-top:22px}\n.steps .n{font-family:var(--serif);font-size:40px;color:var(--bronze);line-height:1}\n.steps h3{font-size:22px;margin:14px 0 8px}\n.steps p:not(.n){color:var(--muted);font-size:16px}\n.team{gap:40px!important;margin-top:46px!important}\n.person{gap:28px!important;margin:0!important}\n.portrait{aspect-ratio:3/4;background:linear-gradient(170deg,#E6DFD3,#D6CCBB);display:flex;align-items:flex-end;padding:14px;font-size:11.5px;color:#7A7262;letter-spacing:.03em}\n.person h3{font-size:26px}\n.person .role{color:var(--bronze);font-weight:600;font-size:14px;margin:6px 0 14px;letter-spacing:.02em}\n.person .bio{font-size:15.5px;color:var(--muted)}\n.person .contact-line{margin-top:14px;font-size:14.5px}\n.band{background:var(--ink);color:var(--paper)}\n.band .wp-block-columns{gap:60px;align-items:center!important}\n.band h2{color:var(--paper)}\n.band p:not(.eyebrow){color:rgba(246,243,238,.75)}\n.facts{gap:1px!important;background:rgba(246,243,238,.14)}\n.facts p{background:var(--ink);padding:24px 22px;font-size:14px;color:rgba(246,243,238,.7)!important}\n.facts strong{display:block;font-family:var(--serif);font-weight:500;font-size:22px;color:var(--bronze-l);margin-bottom:4px}\n.news .wp-block-post-template{gap:24px;margin-top:40px}\n.news .wp-block-post{background:var(--white);border:1px solid var(--line);padding:26px 26px 28px}\n.news .wp-block-post-date{font-size:13px;color:var(--bronze);font-weight:600;letter-spacing:.06em}\n.news .wp-block-post-title{font-size:22px;margin:10px 0 10px}\n.news .wp-block-post-title a{text-decoration:none}\n.news .wp-block-post-excerpt{font-size:15px;color:var(--muted)}\n.news .wp-block-post-excerpt__more-text{margin-top:12px}\n.news .all{margin-top:28px;font-weight:600}\n.sec.news{padding-bottom:24px}\n.contact .wp-block-columns{gap:60px}\n.card{background:var(--white);border:1px solid var(--line);padding:34px!important}\n.card h3{font-size:24px;margin-bottom:6px}\n.note{font-size:13px;color:var(--muted)}\n.vform{display:grid;gap:14px;margin-top:22px}\n.vform label{font-size:13.5px;font-weight:600;display:grid;gap:6px}\n.vform input,.vform select,.vform textarea{font:inherit;font-size:15.5px;padding:13px 14px;border:1px solid var(--line);background:var(--paper);border-radius:2px;color:var(--ink)}\n.vform textarea{min-height:96px}\n.vform button{font:inherit;font-weight:600;font-size:15.5px;padding:15px 24px;border:0;border-radius:2px;background:var(--ink);color:var(--paper);justify-self:start;cursor:pointer}\n.info-label{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze);font-weight:600;margin-top:22px!important}\n.info-value{font-size:18px;margin-top:4px!important}\n.map{margin-top:26px!important;aspect-ratio:16/9;background:linear-gradient(135deg,#E9E3D8,#DDD4C4);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}\n\n/* σελίδες τομέα και άρθρα */\n.page-head{background:var(--ink);color:var(--paper);padding:36px 0 64px}\n.crumb{font-size:13.5px;color:rgba(246,243,238,.6)}\n.crumb a{text-decoration:none}\n.page-head .eyebrow{margin-top:22px}\n.page-head h1{font-size:clamp(36px,5vw,58px);margin:14px 0 18px;max-width:820px}\n.page-head .lead,.page-head .page-lead{color:rgba(246,243,238,.78);font-size:19px;max-width:680px}\n.body-cols{gap:64px!important;padding-top:80px!important;padding-bottom:96px!important;margin-bottom:0!important}\n.body-cols h2.wp-block-heading{font-size:32px;margin:0 0 16px}\n.body-cols .block{margin-bottom:56px}\n.cover{list-style:none;padding:0;margin:22px 0 0;columns:2;column-gap:28px}\n.cover li{break-inside:avoid;padding:13px 0 13px 20px;border-bottom:1px solid var(--line);font-size:16px;position:relative}\n.cover li::before{content:\"\";position:absolute;left:0;top:22px;width:7px;height:7px;background:var(--bronze);transform:rotate(45deg)}\n.steplist{list-style:none;padding:0;margin:22px 0 0;counter-reset:s}\n.steplist li{counter-increment:s;position:relative;padding:16px 0 16px 62px;border-bottom:1px solid var(--line);color:var(--muted);font-size:15.5px}\n.steplist li strong{display:block;color:var(--ink);font-size:17px;font-weight:600}\n.steplist li::before{content:counter(s);position:absolute;left:0;top:14px;font-family:var(--serif);font-size:28px;color:var(--bronze);line-height:1.1}\n.wp-block-details{border-bottom:1px solid var(--line);padding:18px 0}\n.wp-block-details summary{cursor:pointer;font-family:var(--serif);font-size:20.5px;list-style:none;display:flex;justify-content:space-between;gap:20px}\n.wp-block-details summary::-webkit-details-marker{display:none}\n.wp-block-details summary::after{content:\"+\";color:var(--bronze);font-family:var(--sans);font-size:22px}\n.wp-block-details[open] summary::after{content:\"–\"}\n.wp-block-details p{margin-top:10px;color:var(--muted);font-size:16px}\n.small{font-size:13px;color:var(--muted);margin-top:16px!important}\n.updated{font-size:13px;color:var(--muted);margin-top:28px!important}\n.aside-card{background:var(--white);border:1px solid var(--line);padding:28px!important;position:sticky;top:24px}\n.aside-card h3{font-size:22px;margin-bottom:6px}\n.aside-card .who{display:flex;gap:14px;align-items:center;margin:20px 0;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}\n.aside-card .av{width:56px;height:56px;border-radius:50%;background:linear-gradient(170deg,#E6DFD3,#D6CCBB);flex:0 0 56px}\n.aside-card .who b{display:block;font-family:var(--serif);font-weight:500;font-size:17px}\n.aside-card .who span{font-size:13.5px;color:var(--muted)}\n.aside-card .wp-block-button,.aside-card .wp-block-button__link{width:100%;justify-content:center}\n.aside-card .tel{text-align:center;margin-top:12px!important;font-weight:600}\n.aside-card .tel a{text-decoration:none}\n.article{max-width:760px;margin:0 auto;padding:72px 24px 96px}\n.article .wp-block-post-content>*+*{margin-top:18px}\n.article h2.wp-block-heading{font-size:28px;margin-top:36px!important}\n.article .disclaimer{margin-top:40px!important;padding-top:18px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}\n.post-date-head{font-size:13px;color:var(--bronze-l);font-weight:600;letter-spacing:.08em;margin-top:22px}\n.bloglist{padding:72px 0 96px}\n.bloglist .wp-block-post{padding:28px 0;border-bottom:1px solid var(--line)}\n.bloglist .wp-block-post-date{font-size:13px;color:var(--bronze);font-weight:600;letter-spacing:.06em}\n.bloglist .wp-block-post-title{font-size:26px;margin:8px 0 10px}\n.bloglist .wp-block-post-title a{text-decoration:none}\n.bloglist .wp-block-post-excerpt{color:var(--muted)}\n\n/* meas-items\\\"} -->\\n<ul class=\\\"wp-block-list tomeas-items\\\"><!-- wp:list-item -->\\n<li>Ποινικό δίκαιο<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Αναγκαστική εκτέλεση<span>ανακοπές · αναστολές<\/span><\/li>\\n<!-- /wp:list-item --><\/ul>\\n<!-- /wp:list --><\/div>\\n<!-- /wp:group --><\/div>\\n<!-- /wp:group -->\\n\\n<!-- wp:group {\\\"tagName\\\":\\\"section\\\",\\\"className\\\":\\\"sec cta-band\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<section class=\\\"wp-block-group sec cta-band\\\"><!-- wp:group {\\\"className\\\":\\\"wrap\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group wrap\\\"><!-- wp:paragraph {\\\"className\\\":\\\"eyebrow\\\"} -->\\n<p class=\\\"eyebrow\\\">Επικοινωνία<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:heading -->\\n<h2 class=\\\"wp-block-heading\\\">Ας μιλήσουμε για την υπόθεσή σας<\/h2>\\n<!-- /wp:heading -->\\n\\n<!-- wp:paragraph {\\\"className\\\":\\\"lead\\\"} -->\\n<p class=\\\"lead\\\">Στείλτε μας μήνυμα ή πάρτε τηλέφωνο. Σας καλούμε για να ορίσουμε συνάντηση, στο γραφείο ή τηλεφωνικά.<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:buttons -->\\n<div class=\\\"wp-block-buttons\\\"><!-- wp:button {\\\"className\\\":\\\"gold\\\"} -->\\n<div class=\\\"wp-block-button gold\\\"><a class=\\\"wp-block-button__link wp-element-button\\\" href=\\\"/epikoinonia/\\\">Ζητήστε συνάντηση →<\/a><\/div>\\n<!-- /wp:button -->\\n\\n<!-- wp:button {\\\"className\\\":\\\"line\\\"} -->\\n<div class=\\\"wp-block-button line\\\"><a class=\\\"wp-block-button__link wp-element-button\\\" href=\\\"tel:+302100000000\\\">210 000 0000<\/a><\/div>\\n<!-- /wp:button --><\/div>\\n<!-- /wp:buttons --><\/div>\\n<!-- /wp:group --><\/section>\\n<!-- /wp:group -->\",\n  \"order\": 1\n },\n {\n  \"title\": \"Ακίνητα & Golden Visa\",\n  \"slug\": \"akinita\",\n  \"content\": \"<!-- wp:group {\\\"className\\\":\\\"page-head\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group page-head\\\"><!-- wp:group {\\\"className\\\":\\\"wrap\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group wrap\\\"><!-- wp:paragraph {\\\"className\\\":\\\"crumb\\\"} -->\\n<p class=\\\"crumb\\\"><a href=\\\"/\\\">Αρχική<\/a> / <a href=\\\"/tomeis/\\\">Τομείς<\/a> / Ακίνητα &amp; Golden Visa<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:paragraph {\\\"className\\\":\\\"eyebrow\\\"} -->\\n<p class=\\\"eyebrow\\\">Τομέας δραστηριότητας<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:heading {\\\"level\\\":1} -->\\n<h1 class=\\\"wp-block-heading\\\">Δικηγόρος ακινήτων στην Αθήνα<\/h1>\\n<!-- /wp:heading -->\\n\\n<!-- wp:paragraph {\\\"className\\\":\\\"page-lead\\\"} -->\\n<p class=\\\"page-lead\\\">Αγορά, πώληση και μίσθωση ακινήτων, έλεγχος τίτλων και Golden Visa. Ελέγχουμε το ακίνητο πριν δεσμευτείτε και σας συνοδεύουμε ως την υπογραφή.<\/p>\\n<!-- /wp:paragraph --><\/div>\\n<!-- /wp:group --><\/div>\\n<!-- /wp:group -->\\n\\n<!-- wp:columns {\\\"className\\\":\\\"wrap body-cols\\\"} -->\\n<div class=\\\"wp-block-columns wrap body-cols\\\"><!-- wp:column {\\\"width\\\":\\\"66%\\\"} -->\\n<div class=\\\"wp-block-column\\\" style=\\\"flex-basis:66%\\\"><!-- wp:image {\\\"sizeSlug\\\":\\\"large\\\",\\\"className\\\":\\\"body-photo\\\"} -->\\n<figure class=\\\"wp-block-image size-large body-photo\\\"><img src=\\\"https://images.unsplash.com/photo-1786179371621-83d5a2c2cf95?w=1200&amp;q=80&amp;auto=format&amp;fit=crop\\\" alt=\\\"Πρόσοψη πολυκατοικίας στην Αθήνα\\\"/><\/figure>\\n<!-- /wp:image -->\\n\\n<!-- wp:group {\\\"className\\\":\\\"block\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group block\\\"><!-- wp:heading -->\\n<h2 class=\\\"wp-block-heading\\\">Τι καλύπτουμε<\/h2>\\n<!-- /wp:heading -->\\n\\n<!-- wp:paragraph -->\\n<p>Ενδεικτικά, οι υποθέσεις ακινήτων που χειρίζεται το γραφείο:<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:list {\\\"className\\\":\\\"cover\\\"} -->\\n<ul class=\\\"wp-block-list cover\\\"><!-- wp:list-item -->\\n<li>Αγορά και πώληση ακινήτου<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Έλεγχος τίτλων και βαρών<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Κτηματολόγιο: δηλώσεις και διορθώσεις<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Μισθώσεις κατοικιών και επαγγελματικών χώρων<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Golden Visa: το ακίνητο και η διαδικασία<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Γονικές παροχές και δωρεές ακινήτων<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Διαφορές μεταξύ συνιδιοκτητών<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Αποδόσεις μισθίου<\/li>\\n<!-- /wp:list-item --><\/ul>\\n<!-- /wp:list --><\/div>\\n<!-- /wp:group -->\\n\\n<!-- wp:group {\\\"className\\\":\\\"block\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group block\\\"><!-- wp:heading -->\\n<h2 class=\\\"wp-block-heading\\\">Πώς προχωράμε<\/h2>\\n<!-- /wp:heading -->\\n\\n<!-- wp:list {\\\"ordered\\\":true,\\\"className\\\":\\\"steplist\\\"} -->\\n<ol class=\\\"wp-block-list steplist\\\"><!-- wp:list-item -->\\n<li><strong>Πρώτη συνάντηση.<\/strong> Μας λέτε τι θέλετε να κάνετε και μας δίνετε ό,τι στοιχεία έχετε για το ακίνητο.<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li><strong>Έλεγχος.<\/strong> Τίτλοι, κτηματολόγιο, βάρη και, με μηχανικό, η πολεοδομική κατάσταση. Σας λέμε αν κάτι δεν είναι καθαρό.<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li><strong>Υπογραφή.<\/strong> Ελέγχουμε το σχέδιο του συμβολαίου και είμαστε μαζί σας στον συμβολαιογράφο.<\/li>\\n<!-- /wp:list-item --><\/ol>\\n<!-- /wp:list --><\/div>\\n<!-- /wp:group -->\\n\\n<!-- wp:group {\\\"className\\\":\\\"block\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group block\\\"><!-- wp:heading -->\\n<h2 class=\\\"wp-block-heading\\\">Συχνές ερωτήσεις<\/h2>\\n<!-- /wp:heading -->\\n\\n<!-- wp:details {\\\"showContent\\\":true} -->\\n<details class=\\\"wp-block-details\\\" open><summary>Πόσο χρόνο παίρνει ο έλεγχος ενός ακινήτου;<\/summary><!-- wp:paragraph -->\\n<p>Εξαρτάται από το ακίνητο· σας το λέμε στην πρώτη συνάντηση. Καλό είναι να ξεκινά πριν δώσετε προκαταβολή.<\/p>\\n<!-- /wp:paragraph --><\/details>\\n<!-- /wp:details -->\\n\\n<!-- wp:details -->\\n<details class=\\\"wp-block-details\\\"><summary>Μπορείτε να με εκπροσωπήσετε αν μένω στο εξωτερικό;<\/summary><!-- wp:paragraph -->\\n<p>Στις περισσότερες περιπτώσεις ναι, με πληρεξούσιο. Σας λέμε τι χρειάζεται στη δική σας περίπτωση.<\/p>\\n<!-- /wp:paragraph --><\/details>\\n<!-- /wp:details -->\\n\\n<!-- wp:paragraph {\\\"className\\\":\\\"small\\\"} -->\\n<p class=\\\"small\\\">Οι απαντήσεις είναι γενική ενημέρωση και δεν αντικαθιστούν νομική συμβουλή για τη δική σας περίπτωση.<\/p>\\n<!-- /wp:paragraph --><\/div>\\n<!-- /wp:group -->\\n\\n<!-- wp:paragraph {\\\"className\\\":\\\"updated\\\"} -->\\n<p class=\\\"updated\\\">Τελευταία ενημέρωση σελίδας: Νοέμβριος 2026<\/p>\\n<!-- /wp:paragraph --><\/div>\\n<!-- /wp:column -->\\n\\n<!-- wp:column {\\\"width\\\":\\\"34%\\\"} -->\\n<div class=\\\"wp-block-column\\\" style=\\\"flex-basis:34%\\\"><!-- wp:group {\\\"className\\\":\\\"aside-card\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group aside-card\\\"><!-- wp:heading {\\\"level\\\":3} -->\\n<h3 class=\\\"wp-block-heading\\\">Μιλήστε μαζί μας<\/h3>\\n<!-- /wp:heading -->\\n\\n<!-- wp:paragraph {\\\"className\\\":\\\"note\\\"} -->\\n<p class=\\\"note\\\">Συνάντηση στο γραφείο ή τηλεφωνικά.<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:html -->\\n<div class=\\\"who\\\"><img class=\\\"av\\\" src=\\\"https://images.unsplash.com/photo-1560250097-0b93528c311a?w=160&amp;q=80&amp;auto=format&amp;fit=crop&amp;crop=faces\\\" alt=\\\"Πορτρέτο δικηγόρου\\\"><div><b>Επικεφαλής δικηγόρος<\/b><span>Δικηγόρος παρ' Αρείω Πάγω<\/span><\/div><\/div>\\n<!-- /wp:html -->\\n\\n<!-- wp:buttons -->\\n<div class=\\\"wp-block-buttons\\\"><!-- wp:button -->\\n<div class=\\\"wp-block-button\\\"><a class=\\\"wp-block-button__link wp-element-button\\\" href=\\\"/epikoinonia/\\\">Ζητήστε συνάντηση →<\/a><\/div>\\n<!-- /wp:button --><\/div>\\n<!-- /wp:buttons -->\\n\\n<!-- wp:paragraph {\\\"className\\\":\\\"tel\\\"} -->\\n<p class=\\\"tel\\\"><a href=\\\"tel:+302100000000\\\">210 000 0000<\/a><\/p>\\n<!-- /wp:paragraph --><\/div>\\n<!-- /wp:group --><\/div>\\n<!-- /wp:column --><\/div>\\n<!-- /wp:columns -->\",\n  \"order\": 2,\n  \"excerpt\": \"Αγορά, πώληση και μίσθωση ακινήτων, έλεγχος τίτλων και Golden Visa.\"\n },\n {\n  \"title\": \"Κληρονομικό δίκαιο\",\n  \"slug\": \"kleronomiko-dikaio\",\n  \"content\": \"<!-- wp:group {\\\"className\\\":\\\"page-head\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group page-head\\\"><!-- wp:group {\\\"className\\\":\\\"wrap\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group wrap\\\"><!-- wp:paragraph {\\\"className\\\":\\\"crumb\\\"} -->\\n<p class=\\\"crumb\\\"><a href=\\\"/\\\">Αρχική<\/a> / <a href=\\\"/tomeis/\\\">Τομείς<\/a> / Κληρονομικό δίκαιο<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:paragraph {\\\"className\\\":\\\"eyebrow\\\"} -->\\n<p class=\\\"eyebrow\\\">Τομέας δραστηριότητας<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:heading {\\\"level\\\":1} -->\\n<h1 class=\\\"wp-block-heading\\\">Δικηγόρος κληρονομικού δικαίου στην Αθήνα<\/h1>\\n<!-- /wp:heading -->\\n\\n<!-- wp:paragraph {\\\"className\\\":\\\"page-lead\\\"} -->\\n<p class=\\\"page-lead\\\">Διαθήκες, αποδοχή ή αποποίηση κληρονομίας, νόμιμη μοίρα και κληρονομικές διαφορές. Σας εξηγούμε τι ισχύει στη δική σας περίπτωση και αναλαμβάνουμε τη διαδικασία ως το τέλος.<\/p>\\n<!-- /wp:paragraph --><\/div>\\n<!-- /wp:group --><\/div>\\n<!-- /wp:group -->\\n\\n<!-- wp:columns {\\\"className\\\":\\\"wrap body-cols\\\"} -->\\n<div class=\\\"wp-block-columns wrap body-cols\\\"><!-- wp:column {\\\"width\\\":\\\"66%\\\"} -->\\n<div class=\\\"wp-block-column\\\" style=\\\"flex-basis:66%\\\"><!-- wp:image {\\\"sizeSlug\\\":\\\"large\\\",\\\"className\\\":\\\"body-photo\\\"} -->\\n<figure class=\\\"wp-block-image size-large body-photo\\\"><img src=\\\"https://images.unsplash.com/photo-1473186505569-9c61870c11f9?w=1200&amp;q=80&amp;auto=format&amp;fit=crop\\\" alt=\\\"Πένα πάνω σε χειρόγραφη επιστολή\\\"/><\/figure>\\n<!-- /wp:image -->\\n\\n<!-- wp:group {\\\"className\\\":\\\"block\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group block\\\"><!-- wp:heading -->\\n<h2 class=\\\"wp-block-heading\\\">Τι καλύπτουμε<\/h2>\\n<!-- /wp:heading -->\\n\\n<!-- wp:paragraph -->\\n<p>Ενδεικτικά, οι υποθέσεις κληρονομικού δικαίου που χειρίζεται το γραφείο:<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:list {\\\"className\\\":\\\"cover\\\"} -->\\n<ul class=\\\"wp-block-list cover\\\"><!-- wp:list-item -->\\n<li>Αποδοχή και αποποίηση κληρονομίας<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Διαθήκες: ιδιόγραφη, δημόσια, μυστική<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Κληρονομητήρια<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Εξ αδιαθέτου κληρονομική διαδοχή<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Νόμιμη μοίρα<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Κληρονομικές διαφορές και αγωγές περί κλήρου<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Κληρονομικό καταπίστευμα<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Δωρεές αιτία θανάτου<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Μέμψη άστοργης δωρεάς<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Κληρονομική αναξιότητα<\/li>\\n<!-- /wp:list-item --><\/ul>\\n<!-- /wp:list --><\/div>\\n<!-- /wp:group -->\\n\\n<!-- wp:group {\\\"className\\\":\\\"block\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group block\\\"><!-- wp:heading -->\\n<h2 class=\\\"wp-block-heading\\\">Πώς προχωράμε<\/h2>\\n<!-- /wp:heading -->\\n\\n<!-- wp:list {\\\"ordered\\\":true,\\\"className\\\":\\\"steplist\\\"} -->\\n<ol class=\\\"wp-block-list steplist\\\"><!-- wp:list-item -->\\n<li><strong>Πρώτη συνάντηση.<\/strong> Μας λέτε την περίπτωση και φέρνετε ό,τι έγγραφα έχετε. Σας λέμε τι προθεσμίες τρέχουν.<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li><strong>Συγκέντρωση εγγράφων.<\/strong> Σας δίνουμε λίστα με ό,τι χρειάζεται και αναλαμβάνουμε όσα βγαίνουν από υπηρεσίες.<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li><strong>Η διαδικασία.<\/strong> Συμβολαιογράφος, δικαστήριο ή υπηρεσίες: σας ενημερώνουμε σε κάθε βήμα.<\/li>\\n<!-- /wp:list-item --><\/ol>\\n<!-- /wp:list --><\/div>\\n<!-- /wp:group -->\\n\\n<!-- wp:group {\\\"className\\\":\\\"block\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group block\\\"><!-- wp:heading -->\\n<h2 class=\\\"wp-block-heading\\\">Συχνές ερωτήσεις<\/h2>\\n<!-- /wp:heading -->\\n\\n<!-- wp:details {\\\"showContent\\\":true} -->\\n<details class=\\\"wp-block-details\\\" open><summary>Σε πόσο χρόνο μπορώ να αποποιηθώ μια κληρονομιά;<\/summary><!-- wp:paragraph -->\\n<p>Σε τέσσερις μήνες από τότε που μάθατε ότι σας επήχθη η κληρονομιά και για ποιο λόγο. Αν ο θανών είχε την τελευταία του κατοικία στο εξωτερικό ή εσείς μένατε στο εξωτερικό όταν το μάθατε, η προθεσμία είναι ένας χρόνος (άρθρο 1847 ΑΚ). Αν περάσει η προθεσμία, θεωρείται ότι την αποδεχτήκατε.<\/p>\\n<!-- /wp:paragraph --><\/details>\\n<!-- /wp:details -->\\n\\n<!-- wp:details -->\\n<details class=\\\"wp-block-details\\\"><summary>Χρειάζεται αποδοχή για να περάσει ένα ακίνητο στο όνομά μου;<\/summary><!-- wp:paragraph -->\\n<p>Ναι. Για τα ακίνητα χρειάζεται αποδοχή κληρονομίας με συμβολαιογραφική πράξη και μεταγραφή ή καταχώριση στο κτηματολόγιο.<\/p>\\n<!-- /wp:paragraph --><\/details>\\n<!-- /wp:details -->\\n\\n<!-- wp:details -->\\n<details class=\\\"wp-block-details\\\"><summary>Τι να φέρω στην πρώτη συνάντηση;<\/summary><!-- wp:paragraph -->\\n<p>Τη ληξιαρχική πράξη θανάτου, τη διαθήκη αν υπάρχει, και ό,τι έχετε για την περιουσία: τίτλους ακινήτων, λογαριασμούς, αυτοκίνητα. Ό,τι λείπει, σας λέμε πώς βγαίνει.<\/p>\\n<!-- /wp:paragraph --><\/details>\\n<!-- /wp:details -->\\n\\n<!-- wp:details -->\\n<details class=\\\"wp-block-details\\\"><summary>Μπορώ να χειριστώ την κληρονομιά αν μένω στο εξωτερικό;<\/summary><!-- wp:paragraph -->\\n<p>Στις περισσότερες περιπτώσεις ναι, με πληρεξούσιο. Σας λέμε στη συνάντηση τι χρειάζεται στη δική σας περίπτωση.<\/p>\\n<!-- /wp:paragraph --><\/details>\\n<!-- /wp:details -->\\n\\n<!-- wp:paragraph {\\\"className\\\":\\\"small\\\"} -->\\n<p class=\\\"small\\\">Οι απαντήσεις είναι γενική ενημέρωση και δεν αντικαθιστούν νομική συμβουλή για τη δική σας περίπτωση.<\/p>\\n<!-- /wp:paragraph --><\/div>\\n<!-- /wp:group -->\\n\\n<!-- wp:paragraph {\\\"className\\\":\\\"updated\\\"} -->\\n<p class=\\\"updated\\\">Τελευταία ενημέρωση σελίδας: Νοέμβριος 2026<\/p>\\n<!-- /wp:paragraph --><\/div>\\n<!-- /wp:column -->\\n\\n<!-- wp:column {\\\"width\\\":\\\"34%\\\"} -->\\n<div class=\\\"wp-block-column\\\" style=\\\"flex-basis:34%\\\"><!-- wp:group {\\\"className\\\":\\\"aside-card\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group aside-card\\\"><!-- wp:heading {\\\"level\\\":3} -->\\n<h3 class=\\\"wp-block-heading\\\">Μιλήστε μαζί μας<\/h3>\\n<!-- /wp:heading -->\\n\\n<!-- wp:paragraph {\\\"className\\\":\\\"note\\\"} -->\\n<p class=\\\"note\\\">Συνάντηση στο γραφείο ή τηλεφωνικά.<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:html -->\\n<div class=\\\"who\\\"><img class=\\\"av\\\" src=\\\"https://images.unsplash.com/photo-1560250097-0b93528c311a?w=160&amp;q=80&amp;auto=format&amp;fit=crop&amp;crop=faces\\\" alt=\\\"Πορτρέτο δικηγόρου\\\"><div><b>Επικεφαλής δικηγόρος<\/b><span>Δικηγόρος παρ' Αρείω Πάγω<\/span><\/div><\/div>\\n<!-- /wp:html -->\\n\\n<!-- wp:buttons -->\\n<div class=\\\"wp-block-buttons\\\"><!-- wp:button -->\\n<div class=\\\"wp-block-button\\\"><a class=\\\"wp-block-button__link wp-element-button\\\" href=\\\"/epikoinonia/\\\">Ζητήστε συνάντηση →<\/a><\/div>\\n<!-- /wp:button --><\/div>\\n<!-- /wp:buttons -->\\n\\n<!-- wp:paragraph {\\\"className\\\":\\\"tel\\\"} -->\\n<p class=\\\"tel\\\"><a href=\\\"tel:+302100000000\\\">210 000 0000<\/a><\/p>\\n<!-- /wp:paragraph --><\/div>\\n<!-- /wp:group --><\/div>\\n<!-- /wp:column --><\/div>\\n<!-- /wp:columns -->\",\n  \"order\": 3,\n  \"excerpt\": \"Διαθήκες, αποδοχή και αποποίηση κληρονομίας, νόμιμη μοίρα, κληρονομητήρια.\"\n },\n {\n  \"title\": \"Το γραφείο\",\n  \"slug\": \"to-grafeio\",\n  \"content\": \"<!-- wp:group {\\\"className\\\":\\\"page-head\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group page-head\\\"><!-- wp:group {\\\"className\\\":\\\"wrap\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group wrap\\\"><!-- wp:paragraph {\\\"className\\\":\\\"crumb\\\"} -->\\n<p class=\\\"crumb\\\"><a href=\\\"/\\\">Αρχική<\/a> / Το γραφείο<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:paragraph {\\\"className\\\":\\\"eyebrow\\\"} -->\\n<p class=\\\"eyebrow\\\">Το γραφείο<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:heading {\\\"level\\\":1} -->\\n<h1 class=\\\"wp-block-heading\\\">Ένα γραφείο στο κέντρο της Αθήνας, με προσωπική επαφή<\/h1>\\n<!-- /wp:heading -->\\n\\n<!-- wp:paragraph {\\\"className\\\":\\\"page-lead\\\"} -->\\n<p class=\\\"page-lead\\\">Κάθε υπόθεση την παρακολουθεί ο ίδιος δικηγόρος από την αρχή ως το τέλος.<\/p>\\n<!-- /wp:paragraph --><\/div>\\n<!-- /wp:group --><\/div>\\n<!-- /wp:group -->\\n\\n<!-- wp:group {\\\"className\\\":\\\"wrap about\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group wrap about\\\"><!-- wp:image {\\\"sizeSlug\\\":\\\"large\\\",\\\"className\\\":\\\"wide-photo\\\"} -->\\n<figure class=\\\"wp-block-image size-large wide-photo\\\"><img src=\\\"https://images.unsplash.com/photo-1571624436279-b272aff752b5?w=1800&amp;q=80&amp;auto=format&amp;fit=crop\\\" alt=\\\"Αίθουσα συσκέψεων του γραφείου\\\"/><\/figure>\\n<!-- /wp:image -->\\n\\n<!-- wp:columns {\\\"className\\\":\\\"about-cols\\\"} -->\\n<div class=\\\"wp-block-columns about-cols\\\"><!-- wp:column {\\\"width\\\":\\\"58%\\\"} -->\\n<div class=\\\"wp-block-column\\\" style=\\\"flex-basis:58%\\\"><!-- wp:heading -->\\n<h2 class=\\\"wp-block-heading\\\">Πώς δουλεύουμε με τους πελάτες μας<\/h2>\\n<!-- /wp:heading -->\\n\\n<!-- wp:paragraph -->\\n<p>Μιλάτε απευθείας με τον δικηγόρο σας, όχι με μια γραμματεία. Πριν ξεκινήσουμε ξέρετε τι θα γίνει, πόσο θα πάρει και πόσο θα κοστίσει: η αμοιβή συμφωνείται γραπτώς.<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:paragraph -->\\n<p>Εξυπηρετούμε ιδιώτες και επιχειρήσεις, και πελάτες από το εξωτερικό για ακίνητα, κληρονομιές και Golden Visa, στα ελληνικά και στα αγγλικά.<\/p>\\n<!-- /wp:paragraph --><\/div>\\n<!-- /wp:column -->\\n\\n<!-- wp:column {\\\"width\\\":\\\"42%\\\"} -->\\n<div class=\\\"wp-block-column\\\" style=\\\"flex-basis:42%\\\"><!-- wp:group {\\\"className\\\":\\\"facts\\\",\\\"layout\\\":{\\\"type\\\":\\\"grid\\\",\\\"columnCount\\\":2,\\\"minimumColumnWidth\\\":null}} -->\\n<div class=\\\"wp-block-group facts\\\"><!-- wp:paragraph -->\\n<p><strong>Άρειος Πάγος<\/strong>παράσταση σε όλα τα δικαστήρια<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:paragraph -->\\n<p><strong>14 τομείς<\/strong>από ακίνητα έως ενέργεια<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:paragraph -->\\n<p><strong>Κολωνάκι<\/strong>στο κέντρο της Αθήνας<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:paragraph -->\\n<p><strong>ΕΛ · EN<\/strong>εξυπηρέτηση και στα αγγλικά<\/p>\\n<!-- /wp:paragraph --><\/div>\\n<!-- /wp:group --><\/div>\\n<!-- /wp:column --><\/div>\\n<!-- /wp:columns --><\/div>\\n<!-- /wp:group -->\\n\\n<!-- wp:group {\\\"tagName\\\":\\\"section\\\",\\\"className\\\":\\\"sec how\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<section class=\\\"wp-block-group sec how\\\"><!-- wp:group {\\\"className\\\":\\\"wrap\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group wrap\\\"><!-- wp:paragraph {\\\"className\\\":\\\"eyebrow\\\"} -->\\n<p class=\\\"eyebrow\\\">Τα βήματα<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:heading -->\\n<h2 class=\\\"wp-block-heading\\\">Τρία βήματα, χωρίς εκπλήξεις<\/h2>\\n<!-- /wp:heading -->\\n\\n<!-- wp:columns {\\\"className\\\":\\\"steps\\\"} -->\\n<div class=\\\"wp-block-columns steps\\\"><!-- wp:column -->\\n<div class=\\\"wp-block-column\\\"><!-- wp:paragraph {\\\"className\\\":\\\"n\\\"} -->\\n<p class=\\\"n\\\">1<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:heading {\\\"level\\\":3} -->\\n<h3 class=\\\"wp-block-heading\\\">Συνάντηση<\/h3>\\n<!-- /wp:heading -->\\n\\n<!-- wp:paragraph -->\\n<p>Στο γραφείο ή τηλεφωνικά. Μας λέτε την υπόθεση και φέρνετε ό,τι έγγραφα έχετε.<\/p>\\n<!-- /wp:paragraph --><\/div>\\n<!-- /wp:column -->\\n\\n<!-- wp:column -->\\n<div class=\\\"wp-block-column\\\"><!-- wp:paragraph {\\\"className\\\":\\\"n\\\"} -->\\n<p class=\\\"n\\\">2<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:heading {\\\"level\\\":3} -->\\n<h3 class=\\\"wp-block-heading\\\">Εκτίμηση<\/h3>\\n<!-- /wp:heading -->\\n\\n<!-- wp:paragraph -->\\n<p>Σας εξηγούμε τις επιλογές σας, τα βήματα και τον χρόνο που χρειάζεται κάθε δρόμος.<\/p>\\n<!-- /wp:paragraph --><\/div>\\n<!-- /wp:column -->\\n\\n<!-- wp:column -->\\n<div class=\\\"wp-block-column\\\"><!-- wp:paragraph {\\\"className\\\":\\\"n\\\"} -->\\n<p class=\\\"n\\\">3<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:heading {\\\"level\\\":3} -->\\n<h3 class=\\\"wp-block-heading\\\">Γραπτή συμφωνία<\/h3>\\n<!-- /wp:heading -->\\n\\n<!-- wp:paragraph -->\\n<p>Η αμοιβή συμφωνείται γραπτώς πριν ξεκινήσουμε. Σας ενημερώνουμε σε κάθε στάδιο.<\/p>\\n<!-- /wp:paragraph --><\/div>\\n<!-- /wp:column --><\/div>\\n<!-- /wp:columns --><\/div>\\n<!-- /wp:group --><\/section>\\n<!-- /wp:group -->\\n\\n<!-- wp:group {\\\"tagName\\\":\\\"section\\\",\\\"className\\\":\\\"sec cta-band\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<section class=\\\"wp-block-group sec cta-band\\\"><!-- wp:group {\\\"className\\\":\\\"wrap\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group wrap\\\"><!-- wp:paragraph {\\\"className\\\":\\\"eyebrow\\\"} -->\\n<p class=\\\"eyebrow\\\">Επικοινωνία<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:heading -->\\n<h2 class=\\\"wp-block-heading\\\">Ας μιλήσουμε για την υπόθεσή σας<\/h2>\\n<!-- /wp:heading -->\\n\\n<!-- wp:paragraph {\\\"className\\\":\\\"lead\\\"} -->\\n<p class=\\\"lead\\\">Στείλτε μας μήνυμα ή πάρτε τηλέφωνο. Σας καλούμε για να ορίσουμε συνάντηση, στο γραφείο ή τηλεφωνικά.<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:buttons -->\\n<div class=\\\"wp-block-buttons\\\"><!-- wp:button {\\\"className\\\":\\\"gold\\\"} -->\\n<div class=\\\"wp-block-button gold\\\"><a class=\\\"wp-block-button__link wp-element-button\\\" href=\\\"/epikoinonia/\\\">Ζητήστε συνάντηση →<\/a><\/div>\\n<!-- /wp:button -->\\n\\n<!-- wp:button {\\\"className\\\":\\\"line\\\"} -->\\n<div class=\\\"wp-block-button line\\\"><a class=\\\"wp-block-button__link wp-element-button\\\" href=\\\"tel:+302100000000\\\">210 000 0000<\/a><\/div>\\n<!-- /wp:button --><\/div>\\n<!-- /wp:buttons --><\/div>\\n<!-- /wp:group --><\/section>\\n<!-- /wp:group -->\",\n  \"order\": 4\n },\n {\n  \"title\": \"Δικηγόροι\",\n  \"slug\": \"dikigoroi\",\n  \"content\": \"<!-- wp:group {\\\"className\\\":\\\"page-head\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group page-head\\\"><!-- wp:group {\\\"className\\\":\\\"wrap\\\",\\\"layout\\\":{\\\"type\\\":\\\"default\\\"}} -->\\n<div class=\\\"wp-block-group wrap\\\"><!-- wp:paragraph {\\\"className\\\":\\\"crumb\\\ lumns --><\/section>\\n<!-- /wp:group -->\",\n  \"order\": 7\n }\n]"},{"step":"writeFile","path":"/wordpress/demo-content/posts.json","data":"[\n  {\n    \"title\": \"Αγορά ακινήτου: τι ελέγχει ο δικηγόρος πριν από το συμβόλαιο\",\n    \"slug\": \"agora-akinitou-elegxos\",\n    \"date\": \"2026-11-03 10:00:00\",\n    \"excerpt\": \"Τίτλοι, κτηματολόγιο, βάρη και πολεοδομική κατάσταση: οι έλεγχοι που γίνονται πριν υπογράψετε, και γιατί αξίζει να ξεκινήσουν νωρίς.\",\n    \"content\": \"<!-- wp:paragraph -->\\n<p>Πριν από την υπογραφή του συμβολαίου, ο δικηγόρος του αγοραστή ελέγχει ότι το ακίνητο μπορεί να μεταβιβαστεί χωρίς εκπλήξεις. Οι έλεγχοι παίρνουν συνήθως μερικές μέρες, γι' αυτό καλό είναι να ξεκινούν πριν δώσετε προκαταβολή.<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:heading -->\\n<h2 class=\\\"wp-block-heading\\\">Τι ελέγχουμε<\/h2>\\n<!-- /wp:heading -->\\n\\n<!-- wp:list -->\\n<ul class=\\\"wp-block-list\\\"><!-- wp:list-item -->\\n<li><strong>Τίτλους ιδιοκτησίας:<\/strong> ποιος είναι ο ιδιοκτήτης και πώς απέκτησε το ακίνητο.<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li><strong>Κτηματολόγιο ή υποθηκοφυλακείο:<\/strong> αν οι εγγραφές συμφωνούν με τους τίτλους.<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li><strong>Βάρη:<\/strong> υποθήκες, προσημειώσεις, κατασχέσεις ή εκκρεμείς διεκδικήσεις.<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li><strong>Πολεοδομική κατάσταση:<\/strong> σε συνεργασία με μηχανικό, αν υπάρχουν αυθαίρετα και αν έχουν τακτοποιηθεί.<\/li>\\n<!-- /wp:list-item --><\/ul>\\n<!-- /wp:list -->\\n\\n<!-- wp:paragraph -->\\n<p>Αν κάτι δεν είναι καθαρό, σας το λέμε πριν δεσμευτείτε, μαζί με το τι χρειάζεται για να διορθωθεί.<\/p>\\n<!-- /wp:paragraph -->\"\n  },\n  {\n    \"title\": \"Τι να φέρετε στην πρώτη συνάντηση για μια κληρονομιά\",\n    \"slug\": \"proti-synantisi-kleronomia\",\n    \"date\": \"2026-11-10 10:00:00\",\n    \"excerpt\": \"Μια μικρή λίστα με τα έγγραφα που βοηθούν να δούμε από την πρώτη συνάντηση τι ισχύει και ποιες προθεσμίες τρέχουν.\",\n    \"content\": \"<!-- wp:paragraph -->\\n<p>Όσο περισσότερα στοιχεία έχουμε στην πρώτη συνάντηση, τόσο πιο συγκεκριμένα σας λέμε τι ισχύει στη δική σας περίπτωση. Δεν χρειάζεται να τα έχετε όλα: ό,τι λείπει, σας λέμε πώς βγαίνει.<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:heading -->\\n<h2 class=\\\"wp-block-heading\\\">Τα βασικά έγγραφα<\/h2>\\n<!-- /wp:heading -->\\n\\n<!-- wp:list -->\\n<ul class=\\\"wp-block-list\\\"><!-- wp:list-item -->\\n<li>Ληξιαρχική πράξη θανάτου.<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Τη διαθήκη, αν υπάρχει.<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Ό,τι έχετε για την περιουσία: τίτλους ακινήτων, λογαριασμούς, αυτοκίνητα.<\/li>\\n<!-- /wp:list-item -->\\n\\n<!-- wp:list-item -->\\n<li>Στοιχεία για τυχόν χρέη ή δάνεια.<\/li>\\n<!-- /wp:list-item --><\/ul>\\n<!-- /wp:list -->\\n\\n<!-- wp:paragraph -->\\n<p>Αν υπάρχουν χρέη, η απόφαση για αποδοχή ή αποποίηση έχει προθεσμία. Γι' αυτό καλό είναι να μιλήσουμε νωρίς.<\/p>\\n<!-- /wp:paragraph -->\"\n  },\n  {\n    \"title\": \"Αποποίηση κληρονομίας: σε πόσο χρόνο πρέπει να γίνει\",\n    \"slug\": \"apopoiisi-kleronomias-prothesmia\",\n    \"date\": \"2026-11-17 10:00:00\",\n    \"excerpt\": \"Τέσσερις μήνες, ή ένας χρόνος όταν υπάρχει σχέση με το εξωτερικό. Τι σημαίνει αυτό στην πράξη και τι γίνεται αν περάσει η προθεσμία.\",\n    \"content\": \"<!-- wp:paragraph -->\\n<p>Όταν μια κληρονομιά έχει περισσότερα χρέη από περιουσία, ο κληρονόμος μπορεί να την αποποιηθεί. Η απόφαση όμως έχει προθεσμία.<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:heading -->\\n<h2 class=\\\"wp-block-heading\\\">Η προθεσμία<\/h2>\\n<!-- /wp:heading -->\\n\\n<!-- wp:paragraph -->\\n<p>Η αποποίηση γίνεται σε τέσσερις μήνες από τότε που ο κληρονόμος έμαθε ότι του επήχθη η κληρονομιά και για ποιο λόγο. Αν ο θανών είχε την τελευταία του κατοικία στο εξωτερικό, ή αν ο κληρονόμος έμενε στο εξωτερικό όταν το έμαθε, η προθεσμία είναι ένας χρόνος (άρθρο 1847 ΑΚ).<\/p>\\n<!-- /wp:paragraph -->\\n\\n<!-- wp:heading -->\\n<h2 class=\\\"wp-block-heading\\\">Αν περάσει η προθεσμία<\/h2>\\n<!-- /wp:heading -->\\n\\n<!-- wp:paragraph -->\\n<p>Θεωρείται ότι η κληρονομιά έγινε αποδεκτή, μαζί με τα χρέη της. Γι' αυτό, αν δεν είστε σίγουροι τι περιλαμβάνει η κληρονομιά, μιλήστε με δικηγόρο από τις πρώτες εβδομάδες.<\/p>\\n<!-- /wp:paragraph -->\"\n  }\n]\n"},{"step":"activateTheme","themeFolderName":"dikigoriko"},{"step":"runPHP","code":"<?php\n/**\n * Στήσιμο περιεχομένου του δείγματος (τρέχει μία φορά μέσα στο WordPress Playground).\n * Τα αρχεία περιεχομένου γράφονται από το blueprint στο /wordpress/demo-content/.\n */\nrequire_once '/wordpress/wp-load.php';\n\n// Ως διαχειριστής, για να μη φιλτραριστεί η φόρμα (Custom HTML) κατά την αποθήκευση.\nwp_set_current_user( 1 );\nkses_remove_filters();\n\n// Σβήνουμε το περιεχόμενο-παράδειγμα του WordPress.\nforeach ( get_posts( array( 'post_type' => array( 'post', 'page' ), 'numberposts' => -1, 'post_status' => 'any' ) ) as $p ) {\n\twp_delete_post( $p->ID, true );\n}\n\n$dir = '/wordpress/demo-content/';\n\n$home = 0;\n$nea  = 0;\nforeach ( json_decode( file_get_contents( $dir . 'pages.json' ), true ) as $pg ) {\n\t$id = wp_insert_post( array(\n\t\t'post_type'    => 'page',\n\t\t'post_status'  => 'publish',\n\t\t'post_title'   => $pg['title'],\n\t\t'post_name'    => $pg['slug'],\n\t\t'post_content' => $pg['content'],\n\t\t'post_excerpt' => isset( $pg['excerpt'] ) ? $pg['excerpt'] : '',\n\t\t'menu_order'   => $pg['order'],\n\t) );\n\tif ( ! empty( $pg['front'] ) ) {\n\t\t$home = $id;\n\t}\n\tif ( ! empty( $pg['posts'] ) ) {\n\t\t$nea = $id;\n\t}\n}\n\nforeach ( array( 'Πολιτική απορρήτου' => 'politiki-aporritou', 'Cookies' => 'cookies' ) as $title => $slug ) {\n\twp_insert_post( array(\n\t\t'post_type'    => 'page',\n\t\t'post_status'  => 'draft',\n\t\t'post_title'   => $title,\n\t\t'post_name'    => $slug,\n\t\t'post_content' => \"<!
